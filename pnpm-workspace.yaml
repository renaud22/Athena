# Réglages pnpm (pnpm 11 lit la config ici, plus dans package.json).
# Décision EXPLICITE : ne PAS exécuter de build script à l'install (allowBuilds = false).
# Les binaires natifs sont déjà prébuilts (bindings sharp/unrs/swc) et le client Prisma se
# génère via `prisma generate` au branchement DB. Évite le verrou natif local (OneDrive/
# Defender, cf. MORNING-REPORT) ET le gate « ignored builds » de pnpm v11 — local comme CI.
allowBuilds:
  "@prisma/engines": false
  esbuild: false
  prisma: false
  sharp: false
  unrs-resolver: false

# Ne pas relancer un install de vérification avant chaque script (`pnpm test`, etc.) :
# rend les commandes déterministes et insensibles au verrou natif local.
verifyDepsBeforeRun: false
